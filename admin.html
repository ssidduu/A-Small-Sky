<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Her Answers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one narrow column; the latest final ticket is the hero, older events listed below */
:root{
  --bg:#04060d; --card:#fbf3e6; --ink:#1c1a1f; --soft:#9fb0bf; --pink:#ffa24c; --muted:#8a6a45;
  --f-display:"Instrument Serif", Georgia, serif; --f-body:"Manrope", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(90% 60% at 15% 105%, rgba(255,140,50,.45) 0%, transparent 60%),radial-gradient(70% 50% at 90% 0%, rgba(40,150,160,.25) 0%, transparent 60%),linear-gradient(to top,#0c1a24,var(--bg));background-attachment:fixed;
  color:var(--card);font-family:var(--f-body);padding-inline:16px;padding-block:40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0}
h1 em{color:var(--pink)}
.k{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,240,246,.3);background:rgba(255,240,246,.08);color:var(--card)}
button{font:inherit;font-weight:700;padding:12px 20px;border-radius:999px;border:0;background:var(--card);color:#3b1a05;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--f-display);font-size:34px;line-height:1.05}
.hero .k{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.v{font-family:var(--f-display);font-size:20px;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-radius:14px;background:rgba(255,240,246,.08);border:1px solid rgba(255,240,246,.14);font-size:14px}
.row .when{font-family:var(--f-mono);font-size:11px;color:var(--soft);grid-column:1/-1}
.pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--pink);color:#3b1a05;align-self:start}
.pill.ticket{background:var(--card);color:#3b1a05}
.msg{color:var(--soft);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="k">A Small Sky · private</div>
  <h1>What did <em>she</em> say?</h1>
  <form id="f"><input id="key" type="password" placeholder="Your ADMIN_KEY" autocomplete="current-password"><button>Open</button></form>
  <div class="msg" id="msg">Enter the key you set in Vercel.</div>
  <div id="out" class="wrap" style="gap:18px"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "—").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = iso => new Date(iso).toLocaleString("en-IN", {dateStyle:"medium", timeStyle:"short"});
try { $("key").value = localStorage.getItem("sky-key") || ""; } catch(e) {}

async function load(){
  const key = $("key").value.trim(); if(!key) return;
  $("msg").textContent = "Looking up…";
  const r = await fetch("/api/answer?key=" + encodeURIComponent(key)).catch(() => null);
  if(!r || !r.ok){ $("msg").textContent = r && r.status === 401 ? "Wrong key." : "Couldn't reach the database."; $("out").innerHTML = ""; return; }
  try { localStorage.setItem("sky-key", key); } catch(e) {}
  const { answers } = await r.json();
  if(!answers.length){ $("msg").textContent = "Nothing yet. Send her the link ✦"; $("out").innerHTML = ""; return; }
  $("msg").textContent = `${answers.length} event${answers.length > 1 ? "s" : ""} saved.`;
  const t = answers.find(a => a.stage === "ticket");
  const hero = t ? `<div class="hero">
      <div class="k">Latest plan · ${esc(when(t.at))}</div>
      <div class="big">She said yes${t.her ? ", " + esc(t.her) : ""} ♡</div>
      <div class="grid">
        <div><div class="k">Plan</div><div class="v">${esc(t.plan)}</div></div>
        <div><div class="k">Night</div><div class="v">${esc(t.night)}</div></div>
        <div><div class="k">Time</div><div class="v">${esc(t.time)}</div></div>
        <div><div class="k">Moon</div><div class="v">${esc(t.moon)}</div></div>
      </div>
      <div class="k">Pressed "No" ${t.noCount} time${t.noCount === 1 ? "" : "s"} first</div>
    </div>` : `<div class="hero"><div class="big">She said yes ♡</div><div class="k">She hasn't picked the plan yet</div></div>`;
  const list = answers.map(a => `<div class="row">
      <span class="pill ${a.stage}">${a.stage === "ticket" ? "plan" : "said yes"}</span>
      <span>${a.stage === "ticket" ? `${esc(a.plan)} · ${esc(a.night)} · ${esc(a.time)}` : `after ${a.noCount} × No`}</span>
      <span class="when">${esc(when(a.at))}${a.her ? " · " + esc(a.her) : ""}</span></div>`).join("");
  $("out").innerHTML = hero + `<div class="k">All events</div><div class="list">${list}</div>`;
}
$("f").addEventListener("submit", e => { e.preventDefault(); load(); });
if($("key").value) load();
</script>
</body>
</html>
