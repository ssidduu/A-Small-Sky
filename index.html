<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Small Sky</title>
<meta name="description" content="Someone built you a small sky.">
<meta property="og:title" content="Someone built you a small sky ✦">
<meta property="og:description" content="Open it at night. Tap slowly.">
<meta name="theme-color" content="#04060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen night sky canvas; each chapter is a centered scene that fades/blurs in over it. One look only: night. */
:root{
  --night:#04060d;
  --night-2:#0c1a24;
  --star:#fbf3e6;
  --dim:#9fb0bf;
  --glow:#ffa24c;
  --gold:#ffc97a;
  --f-display:"Instrument Serif", "Times New Roman", serif;
  --f-body:"Manrope", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(90% 60% at 15% 105%, rgba(255,140,50,.55) 0%, rgba(214,90,40,.22) 35%, transparent 65%),radial-gradient(70% 50% at 90% 0%, rgba(40,150,160,.28) 0%, transparent 60%),radial-gradient(40% 30% at 70% 80%, rgba(255,120,150,.12) 0%, transparent 70%),linear-gradient(to top, var(--night-2), var(--night));background-attachment:fixed;
  background-color:var(--night);
  color:var(--star);font-family:var(--f-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
#gloom{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1s ease}

.scene{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  opacity:0;visibility:hidden;filter:blur(12px);transform:scale(1.03);
  transition:opacity .9s ease, filter .9s ease, transform .9s ease, visibility 0s linear .9s;
}
.scene.on{opacity:1;visibility:visible;filter:none;transform:none;transition:opacity .9s ease, filter .9s ease, transform .9s ease}

.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.label b{color:var(--gold);font-weight:500}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:clamp(44px,11vw,104px);letter-spacing:-.01em}
h2{font-size:clamp(34px,7.5vw,64px)}
h1 em,h2 em{color:var(--glow);font-style:italic}
p{margin:0;color:var(--dim);max-width:34ch;line-height:1.55;font-size:16px}

.btn{
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:999px;padding:14px 28px;
  border:1px solid rgba(246,241,231,.25);background:rgba(246,241,231,.06);color:var(--star);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .2s ease, background .2s ease, border-color .2s ease, opacity .3s;
}
.btn:hover{background:rgba(246,241,231,.12);border-color:rgba(246,241,231,.5)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.btn.primary{background:var(--star);color:#3b1a05;border-color:var(--star);box-shadow:0 0 40px -6px rgba(255,160,70,.8)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.25;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

/* typewriter */
.type .w{white-space:nowrap;display:inline}
.type .w > span{opacity:0;transition:opacity .08s}
.type .w > span.v{opacity:1}
/* intro: handwritten greeting + elegant italic line */
#hello{
  font-family:"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  font-size:clamp(64px,15vw,136px);line-height:1.25;letter-spacing:0;
  padding:0 .25em;color:var(--gold);
  text-shadow:0 0 28px rgba(255,160,70,.45), 0 0 80px rgba(255,140,50,.25);
  clip-path:inset(-20% 100% -20% 0);
}
#hello.write{animation:write 2.2s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
#hello2{
  font-family:"Cormorant Garamond", "Instrument Serif", Georgia, serif;font-style:italic;font-weight:500;
  color:var(--star);opacity:.92;max-width:26ch;text-wrap:balance;
  font-size:clamp(22px,3.4vw,30px);line-height:1.35;letter-spacing:.005em;
}
@media (prefers-reduced-motion:reduce){#hello{clip-path:none}}

/* 02 ask */
.ask .row{min-height:64px}
#yes{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#no.melt{animation:melt 1.6s ease-in forwards;pointer-events:none}
@keyframes melt{
  0%{transform:none}
  20%{transform:rotate(-8deg) skewX(8deg)}
  100%{transform:translateY(80vh) rotate(70deg) scaleY(.4);opacity:0}
}
.caption{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--gold);min-height:1.3em}

/* 03 orbit */
.system{position:relative;width:min(94vw,520px);aspect-ratio:1;max-width:100%}
.system:hover .arm,.system:hover .planet,.system:focus-within .arm,.system:focus-within .planet{animation-play-state:paused}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(246,241,231,.14);left:50%;top:50%;transform:translate(-50%,-50%)}
.sun{
  position:absolute;left:50%;top:50%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff7e0, #ffc15e 40%, #e8621d 100%);
  box-shadow:0 0 70px 14px rgba(255,150,50,.5);display:grid;place-items:center;
  font-family:var(--f-display);font-style:italic;color:#3b1a05;font-size:clamp(15px,3.6vw,20px);
}
.arm{position:absolute;inset:0;animation:spin var(--d) linear infinite;animation-delay:var(--delay);pointer-events:none}
.ppos{position:absolute;left:calc(50% + var(--r));top:50%;transform:translate(-50%,-50%);pointer-events:auto}
.planet{
  display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--star);padding:4px;
  animation:spin var(--d) linear infinite reverse;animation-delay:var(--delay);font:inherit;
}
.planet .ball{
  width:var(--s);aspect-ratio:1;border-radius:50%;background:var(--bg);
  box-shadow:inset -6px -6px 14px rgba(0,0,0,.45), 0 0 22px -4px var(--halo);transition:transform .3s;
}
.planet .nm{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  background:rgba(4,6,13,.6);padding:3px 7px;border-radius:6px;color:var(--dim);transition:color .3s}
.planet:hover .ball,.planet[aria-pressed="true"] .ball{transform:scale(1.25)}
.planet[aria-pressed="true"] .nm{color:#3b1a05;background:var(--gold)}
.planet:focus-visible{outline:1px dashed var(--gold);border-radius:12px}
.system.paused .arm,.system.paused .planet{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.idea{font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;font-size:22px;text-align:center;width:min(100%,340px);
  padding:10px 16px;border-radius:14px;border:1px solid rgba(251,243,230,.25);background:rgba(251,243,230,.06);color:var(--star)}
.idea:focus{outline:none;border-color:var(--gold)}
.picked{font-family:var(--f-display);font-style:italic;font-size:26px;color:var(--gold);min-height:1.2em}

/* 04 calendar */
.cal{width:min(100%,380px);background:rgba(251,243,230,.04);border:1px solid rgba(251,243,230,.12);border-radius:22px;
  padding:16px 14px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
.cal-month{font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;font-weight:500;font-size:26px;line-height:1}
.cal-month span{font-family:var(--f-mono);font-style:normal;font-size:11px;letter-spacing:.18em;color:var(--dim);margin-left:8px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(251,243,230,.2);background:none;color:var(--star);
  font:inherit;font-size:16px;cursor:pointer;display:grid;place-items:center}
.cal-nav button:disabled{opacity:.2;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-variant-numeric:tabular-nums}
.cal-dow{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--dim);text-align:center;padding:4px 0 6px}
.cal-day{aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--star);font:inherit;font-size:15px;cursor:pointer;
  position:relative;transition:background .2s, color .2s, transform .2s}
.cal-day:hover:not(:disabled){background:rgba(251,243,230,.1)}
.cal-day:disabled{color:rgba(251,243,230,.2);cursor:default}
.cal-day.wknd:not(:disabled){color:var(--gold)}
.cal-day.today::after{content:"";position:absolute;left:50%;bottom:14%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--dim)}
.cal-day[aria-pressed="true"]{background:var(--gold);color:#3b1a05;font-weight:700;box-shadow:0 0 24px rgba(255,170,80,.6);transform:scale(1.05)}
.cal-day:focus-visible,.cal-nav button:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.picked-day{font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;font-size:22px;color:var(--gold);min-height:1.3em}
.chip{
  font:inherit;font-size:14px;cursor:pointer;border-radius:999px;padding:10px 16px;background:transparent;color:var(--star);
  border:1px solid rgba(246,241,231,.2);display:flex;flex-direction:column;align-items:center;gap:1px;
}
.chip small{font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3b1a05}
.chip[aria-pressed="true"] small{color:#6b3a10}
.scroll{overflow-y:auto;justify-content:flex-start}
.scroll > :first-child{margin-top:auto}.scroll > :last-child{margin-bottom:auto}

/* 05 the night: a moonlit note, not a booking */
.finale{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bigmoon{width:min(38vw,170px);aspect-ratio:1;filter:drop-shadow(0 0 40px rgba(255,201,122,.45));animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
.bigmoon svg{width:100%;height:100%}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.date-script{font-family:"Pinyon Script", "Snell Roundhand", cursive;font-weight:400;font-size:clamp(56px,13vw,104px);line-height:1.2;
  color:var(--gold);text-shadow:0 0 28px rgba(255,160,70,.45);margin:0;padding:0 .2em}
.date-line{font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;font-weight:500;font-size:clamp(22px,3.6vw,30px);
  line-height:1.35;color:var(--star);max-width:24ch;text-wrap:balance;margin:0}
.date-line b{font-weight:500;color:var(--gold)}
.date-aside{font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;font-size:19px;color:var(--dim);margin:0}
.sign{font-family:"Pinyon Script", cursive;font-size:40px;color:var(--star);opacity:.9;line-height:1.2}
.finale > *{animation:fadeup 1s ease both}
.finale > :nth-child(2){animation-delay:.5s}.finale > :nth-child(3){animation-delay:1s}
.finale > :nth-child(4){animation-delay:1.5s}.finale > :nth-child(5){animation-delay:2s}
.finale > .bigmoon{animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
.toast{font-family:var(--f-mono);font-size:12px;color:var(--gold);min-height:1.2em}

#skip{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:10px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--dim);opacity:.5;background:none;border:0;cursor:pointer;z-index:3}
#sound{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:10px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--dim);background:none;border:0;cursor:pointer;z-index:3}

/* Pip: a tiny star who keeps her company */
#pip{position:fixed;right:16px;bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:flex-end;gap:8px;
  pointer-events:none;flex-direction:row-reverse}
#pipBody{width:64px;height:64px;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;animation:bob 3.2s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(255,190,100,.55));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
#pipBody svg{width:100%;height:100%;overflow:visible}
#pipBody:focus-visible{outline:2px dashed var(--gold);border-radius:50%}
#pipBody.wiggle{animation:wiggle .6s ease}
#pipBody.spin{animation:spinhop 1s cubic-bezier(.3,1.4,.5,1)}
#pip .eyes{transform-origin:32px 32px;transition:transform .08s}
#pip .blink .eyes{transform:scaleY(.1)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes wiggle{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes spinhop{40%{transform:translateY(-26px) rotate(200deg) scale(1.15)}100%{transform:rotate(360deg)}}
.bubble{max-width:min(230px,62vw);background:var(--star);color:#2a1a0c;font-family:"Cormorant Garamond", Georgia, serif;font-style:italic;
  font-weight:500;font-size:18px;line-height:1.25;padding:10px 14px;border-radius:18px 18px 4px 18px;margin-bottom:34px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .3s, transform .3s;text-align:left}
.bubble.on{opacity:1;transform:none}
.tap-star{position:fixed;pointer-events:none;color:var(--gold);font-size:14px;z-index:2;animation:tapstar 1s ease-out forwards;text-shadow:0 0 10px rgba(255,190,100,.9)}
@keyframes tapstar{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(90deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#pipBody{animation:none}}
@media (prefers-reduced-motion:reduce){
  .scene{transition:opacity .3s, visibility 0s linear .3s;filter:none;transform:none}
  .arm,.planet{animation:none!important}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="gloom" aria-hidden="true"></div>

<!-- 00 intro -->
<section class="scene on" id="intro" aria-live="polite">
  <div class="label" id="stamp">Incoming signal</div>
  <h1 id="hello"></h1>
  <p class="type" id="hello2"></p>
  <button class="btn primary" id="lookUp" style="opacity:0">Look up ✦</button>
</section>


<!-- 02 the question -->
<section class="scene ask" id="ask">
  <div class="label">Step <b>01</b> / 03 · The question</div>
  <h1 id="askH">Will you go on a <em>date</em> with me?</h1>
  <div class="row">
    <button class="btn primary" id="yes">Yes ✦</button>
    <button class="btn" id="no">No</button>
  </div>
  <div class="caption" id="noCap"></div>
</section>

<!-- 03 orbit -->
<section class="scene" id="orbit">
  <div class="label">Step <b>02</b> / 03 · Pick a planet</div>
  <h2>Where are <em>we</em> going?</h2>
  <div class="system" id="system">
    <div class="ring" style="width:44%;height:44%"></div>
    <div class="ring" style="width:68%;height:68%"></div>
    <div class="ring" style="width:92%;height:92%"></div>
    <div class="sun">us</div>
  </div>
  <div class="picked" id="picked"></div>
  <input class="idea" id="idea" type="text" maxlength="60" placeholder="tell me your idea…" hidden>
  <button class="btn primary" id="toNight" disabled>This one →</button>
</section>

<!-- 04 night -->
<section class="scene scroll" id="night">
  <div class="label">Step <b>03</b> / 03 · Pick a day</div>
  <h2>When are <em>you</em> free?</h2>
  <div class="cal" id="cal">
    <div class="cal-head">
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav"><button id="calPrev" aria-label="Previous month">‹</button><button id="calNext" aria-label="Next month">›</button></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="picked-day" id="pickedDay" aria-live="polite"></div>
  <div class="row" id="times">
    <button class="chip" aria-pressed="false" data-v="Morning" data-t="10 am – 12">Morning<small>10 am – 12</small></button>
    <button class="chip" aria-pressed="false" data-v="Lunchtime" data-t="12 – 3 pm">Lunchtime<small>12 – 3 pm</small></button>
    <button class="chip" aria-pressed="false" data-v="Golden hour" data-t="5 – 7 pm">Golden hour<small>5 – 7 pm</small></button>
    <button class="chip" aria-pressed="false" data-v="After dark" data-t="7 – 10 pm">After dark<small>7 – 10 pm</small></button>
    <button class="chip" aria-pressed="false" data-v="Midnight walk" data-t="10 pm +">Midnight walk<small>10 pm +</small></button>
  </div>
  <button class="btn primary" id="toPass" disabled>Seal it ✦</button>
</section>

<!-- 05 the night -->
<section class="scene scroll" id="passScene">
  <div class="finale">
    <div class="bigmoon" id="bigMoon" aria-hidden="true"></div>
    <h2 class="date-script">It's a date.</h2>
    <p class="date-line" id="dateLine"></p>
    <p class="date-aside">I'll be the one smiling too much.</p>
    <div class="sign" id="sign"></div>
  </div>
  <div class="row">
    <a class="btn primary" id="wa" target="_blank" rel="noopener" hidden>Send it to him ✦</a>
    <button class="btn" id="copy" hidden>Copy our plan</button>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <button class="btn" id="replay" style="font-size:12px;padding:8px 16px;opacity:.6">Replay the sky</button>
</section>

<button id="sound" aria-pressed="false">♪ Sound off</button>
<button id="skip" hidden>skip →</button>
<div id="pip" aria-live="polite">
  <button id="pipBody" aria-label="Pip, a tiny star. Tap to say hi">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><radialGradient id="pipG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff6d8"/><stop offset=".55" stop-color="#ffc56a"/><stop offset="1" stop-color="#f08a2c"/></radialGradient></defs>
      <path d="M32 5 L39.5 22.5 L58 24.5 L44 37 L48 55.5 L32 46 L16 55.5 L20 37 L6 24.5 L24.5 22.5 Z" fill="url(#pipG)" stroke="#ffd98f" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="22.5" cy="36" rx="3.6" ry="2.2" fill="#ff8a8a" opacity=".6"/>
      <ellipse cx="41.5" cy="36" rx="3.6" ry="2.2" fill="#ff8a8a" opacity=".6"/>
      <g id="pipFace"></g>
    </svg>
  </button>
  <div class="bubble" id="pipSay"></div>
</div>

<script>
/* ─────────────  EDIT ME  ───────────── */
const CONFIG = {
  her: "Siriiiiiiii",  // default name. A link like yoursite.vercel.app/?to=Ananya overrides it
  him: "Sid",         // your name
  whatsapp: "",       // your number with country code, digits only, e.g. "919876543210"
};
/* ───────────────────────────────────── */

const q = new URLSearchParams(location.search);
const HER = (q.get("to") || CONFIG.her || "").trim();
const HIM = (q.get("from") || CONFIG.him || "me").trim();
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = { plan:null, day:null, moon:null, time:null, noCount:0 };

/* ── sky ── */
const cv = $("sky"), cx = cv.getContext("2d");
let W, H, DPR, stars = [], shooters = [], sparks = [], mx = 0, my = 0, warm = 0;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  const n = Math.round(innerWidth * innerHeight / 3200);
  stars = Array.from({length:n}, () => ({
    x:Math.random()*W, y:Math.random()*H, r:(Math.random()**3*1.6+.3)*DPR,
    z:Math.random(), t:Math.random()*6.28, s:.5+Math.random()*1.5
  }));
}
addEventListener("resize", resize); resize();
addEventListener("pointermove", e => { mx = e.clientX/innerWidth - .5; my = e.clientY/innerHeight - .5; });

function shoot(){ if(reduce) return;
  shooters.push({x:Math.random()*W*.8, y:Math.random()*H*.4, vx:(6+Math.random()*6)*DPR, vy:(2+Math.random()*3)*DPR, life:1});
}
function burst(x, y, n=140, hue){
  if(reduce) n = 20;
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, v = (Math.random()*7+1)*DPR;
    sparks.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, c: hue || (Math.random()<.5 ? "255,170,80" : "255,236,200")});
  }
}
let last = 0;
function frame(t){
  const dt = Math.min((t - last)/16.7, 3); last = t;
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    s.t += .02*s.s*dt;
    const a = .45 + Math.sin(s.t)*.35;
    const px = s.x + mx*40*s.z*DPR, py = s.y + my*40*s.z*DPR;
    cx.globalAlpha = Math.max(0, a);
    cx.fillStyle = warm > 0 && s.z > .8 ? `rgb(255,${200 - warm*40},${210 - warm*20})` : "#f6f1e7";
    cx.beginPath(); cx.arc(px, py, s.r, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  shooters = shooters.filter(s => s.life > 0);
  for(const s of shooters){
    const g = cx.createLinearGradient(s.x, s.y, s.x - s.vx*14, s.y - s.vy*14);
    g.addColorStop(0, `rgba(255,255,255,${s.life})`); g.addColorStop(1, "rgba(255,255,255,0)");
    cx.strokeStyle = g; cx.lineWidth = 1.6*DPR;
    cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x - s.vx*14, s.y - s.vy*14); cx.stroke();
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= .012*dt;
  }
  sparks = sparks.filter(p => p.life > 0);
  for(const p of sparks){
    cx.fillStyle = `rgba(${p.c},${p.life})`;
    cx.beginPath(); cx.arc(p.x, p.y, 2*DPR*p.life + .5, 0, 6.283); cx.fill();
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .97; p.vy = p.vy*.97 + .06*DPR*dt; p.life -= .011*dt;
  }
  if(Math.random() < .004*dt) shoot();
  requestAnimationFrame(frame);
}

const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98, 1760];
function chime(i, len=1.6){
  if(!soundOn || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
  o.type = "sine"; o.frequency.value = SCALE[i % SCALE.length];
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.12, now+.02); g.gain.exponentialRampToValueAtTime(.0001, now+len);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now+len);
}

  el.innerHTML = text.split(" ").map(w => `<span class="w">${[...w].map(c => `<span>${c}</span>`).join("")}</span>`).join(" ");

    if(reduce){ spans.forEach(s => s.classList.add("v")); return res(); }
    let i = 0; const tick = () => { if(i < spans.length){ spans[i++].classList.add("v"); setTimeout(tick, speed); } else res(); };
    tick();
  });
}

const SYNODIC = 29.530588853, REF_NEW = Date.UTC(2000, 0, 6, 18, 14);
function phaseOf(d){ const days = (d - REF_NEW)/864e5; return ((days % SYNODIC) + SYNODIC) % SYNODIC / SYNODIC; }
function phaseName(p){
  const names = ["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];
  return names[Math.round(p*8) % 8];
}
function moonSVG(p){
  const r = 18, c = 20, k = Math.cos(p*2*Math.PI), rx = Math.abs(k)*r;
  const waxing = p < .5;
  const outer = waxing ? 1 : 0;                         // lit limb: right when waxing, left when waning
  const crescent = k > 0;                               // less than half lit
  let term = waxing ? (crescent ? 0 : 1) : (crescent ? 1 : 0);
  const d = `M${c} ${c-r} A${r} ${r} 0 0 ${outer} ${c} ${c+r} A${rx} ${r} 0 0 ${term} ${c} ${c-r} Z`;
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#16242e"/>
    <path d="${d}" fill="#f6f1e7"/><circle cx="20" cy="20" r="18" fill="none" stroke="rgba(246,241,231,.25)"/></svg>`;
}
const dayFmt = new Intl.DateTimeFormat("en-IN", {weekday:"short", day:"numeric", month:"short"});
const longFmt = new Intl.DateTimeFormat("en-IN", {weekday:"long", day:"numeric", month:"long"});
const today = new Date(); today.setHours(0,0,0,0);
const firstOk = new Date(today); firstOk.setDate(today.getDate() + 1);   // from tomorrow
const lastOk = new Date(today); lastOk.setDate(today.getDate() + 60);    // up to ~2 months ahead
let view = new Date(firstOk.getFullYear(), firstOk.getMonth(), 1), picked = null;
function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  $("calMonth").innerHTML = `${view.toLocaleDateString("en-IN", {month:"long"})}<span>${y}</span>`;
  $("calPrev").disabled = new Date(y, m, 0) < firstOk;
  $("calNext").disabled = new Date(y, m + 1, 1) > lastOk;
  const g = $("calGrid"); g.innerHTML = "";
  ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(d => g.insertAdjacentHTML("beforeend", `<div class="cal-dow" aria-hidden="true">${d}</div>`));
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;                      // Monday-first
  for(let i=0;i<lead;i++) g.insertAdjacentHTML("beforeend", "<div></div>");
  const days = new Date(y, m + 1, 0).getDate();
  for(let n=1;n<=days;n++){
    const d = new Date(y, m, n), wd = d.getDay();
    const b = document.createElement("button");
    b.className = "cal-day" + (wd === 0 || wd === 6 ? " wknd" : "") + (+d === +today ? " today" : "");
    b.textContent = n; b.disabled = d < firstOk || d > lastOk;
    b.setAttribute("aria-label", longFmt.format(d));
    b.setAttribute("aria-pressed", picked && +picked === +d ? "true" : "false");
    b.onclick = () => {
      picked = d;
      g.querySelectorAll(".cal-day").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      const at9 = new Date(d); at9.setHours(21);
      state.day = dayFmt.format(d); state.phase = phaseOf(at9); state.moon = phaseName(state.phase);
      $("pickedDay").textContent = longFmt.format(d);
      chime(n % 10); checkNight();
    };
    g.appendChild(b);
  }
}

    st.style.setProperty("--dx", Math.cos(a)*r + "px"); st.style.setProperty("--dy", Math.sin(a)*r + "px");
    st.style.fontSize = (9 + Math.random()*9) + "px";
    document.body.appendChild(st); setTimeout(() => st.remove(), 1000);
  }
  chime(Math.floor(Math.random()*10), 1.2);
});
</script>
</body>
